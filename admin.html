<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel de Pedidos | Rafa Delícias Artesanais</title>
  <link rel="icon" type="image/png" href="./favicon.png">
  <link rel="shortcut icon" href="./favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Serif+Text:ital@0;1&family=Manrope:wght@400;500;700;800&display=swap"
    rel="stylesheet"
  >
  <link rel="stylesheet" href="./admin.css">
</head>
<body>
  <main class="admin-page">
    <section class="admin-shell">
      <header class="admin-header">
        <div>
          <p class="admin-kicker">Rafa Delícias Artesanais</p>
          <h1>Painel de Pedidos</h1>
          <p class="admin-description">
            Visualização inicial dos pedidos salvos no PostgreSQL.
          </p>
        </div>

        <div class="admin-actions">
          <button class="refresh-button" id="refreshOrdersButton" type="button">
            Atualizar pedidos
          </button>
          <button class="logout-button" id="adminLogoutButton" type="button">
            Sair
          </button>
        </div>
      </header>

      <section class="orders-panel" aria-labelledby="orders-title">
        <div class="orders-heading">
          <h2 id="orders-title">Pedidos registrados</h2>
          <p id="ordersFeedback" class="orders-feedback">Carregando pedidos...</p>
        </div>

        <section class="filters-panel" aria-labelledby="filters-title">
          <div class="filters-heading">
            <h3 id="filters-title">Filtros</h3>
            <p class="filters-description">Refine a visualização sem precisar consultar a API novamente.</p>
          </div>

          <div class="filters-grid">
            <label class="filter-field">
              <span>Status</span>
              <select id="statusFilter">
                <option value="todos">Todos</option>
                <option value="recebido">Recebido</option>
                <option value="em_producao">Em produção</option>
                <option value="pronto">Pronto</option>
                <option value="entregue">Entregue</option>
                <option value="cancelado">Cancelado</option>
              </select>
            </label>

            <label class="filter-field">
              <span>Busca</span>
              <input
                type="search"
                id="searchFilter"
                placeholder="Buscar por cliente, telefone ou número do pedido"
              >
            </label>
          </div>
        </section>

        <!-- Nesta etapa a proteção visual fica no front-end, mas os dados só são liberados pelas rotas protegidas com JWT. -->
        <div class="orders-list" id="ordersList" aria-live="polite"></div>
      </section>
    </section>
  </main>

  <script src="./admin.js"></script>
</body>
</html>
